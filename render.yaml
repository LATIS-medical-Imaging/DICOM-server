## Render infrastructure-as-code — one file deploys everything.
## Docs: https://render.com/docs/blueprint-spec
##
## After first deploy you must manually set these env vars in the
## "dicom-secrets" environment group (Render dashboard → Env Groups):
##
##   JWT_SECRET_KEY          — python -c "import secrets; print(secrets.token_urlsafe(64))"
##   MINIO_ENDPOINT          — <account-id>.r2.cloudflarestorage.com
##   MINIO_EXTERNAL_ENDPOINT — https://<account-id>.r2.cloudflarestorage.com
##   MINIO_ACCESS_KEY        — R2 API token Access Key ID
##   MINIO_SECRET_KEY        — R2 API token Secret Access Key
##   CORS_ORIGINS            — https://<your-frontend>.vercel.app  (comma-separated)

databases:
  - name: dicom-db
    databaseName: dicom
    user: dicom
    plan: free

services:
  - type: redis
    name: dicom-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # internal only — not reachable from outside Render

  - type: web
    name: dicom-api-pfe
    env: docker
    plan: free
    healthCheckPath: /api/v1/health/live
    # Runs migrations then starts uvicorn (preDeployCommand not available on free tier).
    dockerCommand: sh scripts/start-api.sh
    envVars:
      - fromGroup: dicom-secrets

      # Database — wired automatically from the managed Postgres instance.
      - key: POSTGRES_HOST
        fromDatabase:
          name: dicom-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: dicom-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: dicom-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: dicom-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: dicom-db
          property: database

      # Redis — wired from the managed Redis instance.
      - key: REDIS_HOST
        fromService:
          type: redis
          name: dicom-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: dicom-redis
          property: port

      # Application
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      # Storage (Cloudflare R2 is S3-compatible — no code changes needed)
      - key: MINIO_SECURE
        value: "true"
      - key: MINIO_BUCKET_DICOM
        value: dicom-files
      - key: MINIO_BUCKET_THUMBNAILS
        value: thumbnails
      - key: MINIO_PRESIGNED_URL_EXPIRE_SECONDS
        value: "3600"

      # Pool — keep small on the free tier (max 97 PG connections).
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"


# Shared secrets — set values manually in the Render dashboard after first sync.
# Both the API and worker pull from this group so secrets are never duplicated.
envVarGroups:
  - name: dicom-secrets
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_EXTERNAL_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
