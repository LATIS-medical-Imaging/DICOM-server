# Railway deployment configuration — https://docs.railway.com/reference/config-as-code
#
# This configures the API service (top-level [deploy] is what Railway reads).
# For the worker service pointing to the same repo, set its start command
# manually in the Railway dashboard to:
#   celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2

[build]
builder = "dockerfile"

[deploy]
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
