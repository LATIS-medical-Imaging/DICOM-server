name: dicom-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: dicom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dicom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicom}
      POSTGRES_DB: ${POSTGRES_DB:-dicom}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No host port — internal only (reachable via Docker network)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dicom} -d ${POSTGRES_DB:-dicom}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: dicom-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-dicom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dicom}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dicom}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
    # No host port — internal only
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: dicom-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    # No host port — internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: dicom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_MINIO_ORIGIN}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # Localhost only — Nginx proxies /storage/ here
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    container_name: dicom-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      CORS_MINIO_ORIGIN: ${CORS_MINIO_ORIGIN}
    volumes:
      - ./scripts/minio-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dicom-server:latest
    container_name: dicom-api
    restart: unless-stopped
    command: ["./scripts/start-api.sh"]
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"    # Nginx proxies to this
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    networks:
      - backend

  worker:
    image: dicom-server:latest
    container_name: dicom-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "${CELERY_TASK_DEFAULT_QUEUE:-default}"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      - api
      - redis
      - postgres
    networks:
      - backend

  # Pixel work (filters + segmentation) runs here, not on the ingestion worker:
  # concurrency 1 so a loaded checkpoint is paid for once per process, and a
  # 30 s inference never queues in front of a DICOM upload.
  pixel-worker:
    image: dicom-server:latest
    container_name: dicom-pixel-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "${CELERY_PIXEL_QUEUE:-pixels}", "-n", "pixels@%h"]
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping -d pixels@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      - api
      - redis
      - postgres
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  backend:
    driver: bridge